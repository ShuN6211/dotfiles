name: ubuntu

on:
  push:
    branches:
      - main

jobs:
  ubuntu:
    name: ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        run: curl -sL https://raw.githubusercontent.com/ShuN6211/dotfiles/refs/heads/main/install.sh | sh

      - name: Check shell startup
        run: |
          zsh -i -c exit
          zsh -c 'command -v node uv deno terraform'
